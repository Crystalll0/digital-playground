const langs={en:0,sc:1,tc:2}, KEY='encore-local-v1';
const defaults=()=>({version:1,lang:'en',palette:0,focal:0,design:null,beads:[],checkins:[],rewards:[],ledger:[]});
let state=defaults(),page='design',mode='nfc',place=0,busy=false,lastFocus=null;
try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);if(validState(parsed))state=parsed;}}catch(e){}
function validState(s){return s&&s.version===1&&Object.hasOwn(langs,s.lang)&&[0,1,2].includes(s.palette)&&[0,1,2].includes(s.focal)&&Array.isArray(s.beads)&&s.beads.length<=3&&s.beads.every(b=>b&&['SC-LIVE-001','SC-SPORT-002','SC-MEM-003'].includes(b.id)&&typeof b.name==='string'&&typeof b.note==='string'&&typeof b.date==='string'&&(!b.photo||/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(b.photo)))&&new Set(s.beads.map(b=>b.id)).size===s.beads.length&&Array.isArray(s.checkins)&&s.checkins.length<=3&&s.checkins.every(id=>s.beads.some(b=>b.id===id))&&new Set(s.checkins).size===s.checkins.length&&Array.isArray(s.rewards)&&s.rewards.length<=2&&s.rewards.every(r=>r&&['coffee','care'].includes(r.id)&&typeof r.used==='boolean'&&/^DEMO-[A-Z0-9-]+$/.test(r.code))&&new Set(s.rewards.map(r=>r.id)).size===s.rewards.length&&Array.isArray(s.ledger)&&s.ledger.every(l=>l&&['bindEarn','visitEarn','rewardSpend'].includes(l.kind)&&Number.isFinite(l.points))&&(s.design===null||s.design&&[0,1,2].includes(s.design.palette)&&[0,1,2].includes(s.design.focal));}
const t=k=>words[k]?.[langs[state.lang]]??k;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const events=[{id:'SC-LIVE-001',name:'live',focal:0,palette:0,icon:'star'},{id:'SC-SPORT-002',name:'sport',focal:2,palette:2,icon:'orbit'},{id:'SC-MEM-003',name:'memory',focal:1,palette:1,icon:'wave'}];
const focalKeys=['star','wave','orbit'],paletteKeys=['amethyst','rose','ice'],paletteShort=['lavender','pink','blue'];
const filters=['none','hue-rotate(40deg) saturate(.85)','hue-rotate(300deg) saturate(.75)'];
const balance=()=>state.beads.length*40+state.checkins.length*60-state.rewards.reduce((s,r)=>s+(r.id==='coffee'?80:120),0);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('storagewarn').innerHTML='';return true;}catch(e){document.getElementById('storagewarn').innerHTML=`<div class="storagewarn">${t('storageError')}</div>`;return false;}}
let toastTimer;function toast(msg){document.getElementById('toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3200);}
function nav(){const markup=Object.keys(icons).slice(0,5).map(n=>`<button class="navbtn ${page===n?'active':''}" data-page="${n}" ${page===n?'aria-current="page"':''}>${icon(n)}<span>${t(n)}</span></button>`).join('');document.getElementById('side').innerHTML=markup+`<div class="side-foot">${t('demo')}<br>TEAM ToT<br>Kai Tak Sports Park</div>`;document.getElementById('bottom').innerHTML=markup;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function go(p){if(busy)return;page=p;render();window.scrollTo({top:0,behavior:'instant'});}
function head(title,sub){return `<div class="pagehead"><div><div class="eyebrow">ENCORE / ${t(page)}</div><h1>${t(title)}</h1><p>${t(sub)}</p></div><span class="pill">${t('demo')}</span></div>`;}
function render(){document.documentElement.lang={en:'en',sc:'zh-Hans',tc:'zh-Hant'}[state.lang];document.getElementById('language').value=state.lang;document.getElementById('topnote').textContent=t('local');document.getElementById('help').innerHTML=icon('help');document.getElementById('help').setAttribute('aria-label',t('helpTitle'));nav();document.getElementById('main').innerHTML=({design:designPage,collection:collectionPage,connect:connectPage,explore:explorePage,rewards:rewardsPage}[page])();wire();}
function designPage(){return head('designTitle','designSub')+`<div class="design-grid"><div><div class="product-stage"><img class="heroimg" src="${ASSET}" alt="${esc(t(paletteKeys[state.palette]))} modular crystal bracelet concept" style="filter:${filters[state.palette]}"><div class="focalMark">${icon(focalKeys[state.focal])}</div><div class="stage-label">STELLA CHAO Jewelry</div><div class="stage-bottom"><strong>${t(paletteKeys[state.palette])}</strong><span>${String(state.palette+1).padStart(2,'0')} / 03</span></div></div><div class="productmeta"><span>${t('materials')}</span><span>ToT EDITION</span></div><p class="preview-note">${t('preview')}</p></div><div><div class="controlgroup"><div class="section-label">${t('base')}<span>${t(paletteShort[state.palette])}</span></div><div class="palettes">${['#a494b6','#d7aaa9','#9cb7c8'].map((c,i)=>`<button class="palette" data-palette="${i}" aria-pressed="${state.palette===i}"><span class="swatch" style="--c:${c}"></span><span>${t(paletteShort[i])}</span></button>`).join('')}</div></div><div class="controlgroup"><div class="section-label">${t('focal')}</div><div class="beadoptions">${focalKeys.map((f,i)=>`<button class="beadoption" data-focal="${i}" aria-pressed="${state.focal===i}">${icon(f)}${t(f)}</button>`).join('')}</div><p class="stepinfo">${t(focalKeys[state.focal]+'Desc')}</p><div class="focus-note">${icon(focalKeys[state.focal])}<span>${t(focalKeys[state.focal])} / ${t(paletteShort[state.palette])}</span></div></div><button class="btn full" id="saveDesign">${icon('check')}${t('save')}</button><div class="buttonrow"><button class="btn secondary full" data-page="connect">${icon('connect')}${t('link')}</button></div><div class="mini-story"><span class="num">01</span><div><h3>${t('samebase')}</h3><p class="muted">${t('sametext')}</p></div></div></div></div>`;}
function collectionPage(){return head('collectionTitle','collectionSub')+`<div class="summary"><div><strong>${state.beads.length}</strong><span>${t('beads')}</span></div><div><strong>${state.checkins.length}</strong><span>${t('visits')}</span></div><div><strong>${balance()}</strong><span>${t('points')}</span></div></div>`+(state.beads.length?`<div class="cards">${state.beads.map(b=>{let e=events.find(e=>e.id===b.id);return `<button class="memory-card" data-memory="${b.id}"><div class="memory-cover">${b.photo?`<img src="${b.photo}" alt="${esc(b.name||t(e.name))}">`:`<div class="concept-bead">${ball({colour:GEM[e.palette][1],text:"✧"})}</div>`}<span class="pill">${icon(e.icon)}${t('linked')}</span></div><div class="memory-copy"><span class="eyebrow">${t('sampleEvent')}</span><h3>${esc(b.name||t(e.name))}</h3><div class="small">${esc(b.date||'—')}</div><div class="small" style="margin-top:8px">${t(state.checkins.includes(b.id)?'attendance':'notattendance')}</div></div></button>`}).join('')}</div><div class="buttonrow"><button class="btn secondary" data-page="connect">${icon('connect')}${t('link')}</button></div>`:`<div class="empty">${icon('collection')}<h2>${t('emptyTitle')}</h2><p>${t('emptyText')}</p><button class="btn" data-page="connect">${t('link')}${icon('arrow')}</button></div>`)+(state.design?`<div class="mini-story"><span class="num">✧</span><div><h3>${t('savedDesign')}</h3><p class="muted">${t(paletteKeys[state.design.palette])} / ${t(focalKeys[state.design.focal])}</p><button class="btn secondary" style="margin-top:10px" id="reopen">${t('reopen')}</button></div></div>`:'');}
function connectPage(){return head('connectTitle','connectSub')+`<div class="connect-grid"><div><div class="modebar"><button data-mode="nfc" class="${mode==='nfc'?'active':''}">${t('nfc')}</button><button data-mode="scan" class="${mode==='scan'?'active':''}">${t('scan')}</button></div><div class="scanner" id="scanner"><div><span class="eyebrow">${t('demo')}</span><div class="scanner-symbol">${icon(mode==='nfc'?'nfc':'connect')}</div><h2>${t(mode==='nfc'?'tapTitle':'scanTitle')}</h2><p>${t('simNote')}</p></div></div></div><div><label for="code">${t('codeLabel')}</label><input id="code" value="SC-LIVE-001" spellcheck="false" autocapitalize="characters" maxlength="24" aria-describedby="codeError"><div class="error" id="codeError" role="alert"></div><button class="btn full" id="simulate">${icon(mode==='nfc'?'nfc':'connect')}${t(mode==='nfc'?'simulate':'scanButton')}</button><button class="btn secondary full" id="bind" style="margin-top:10px">${t('bind')}</button><div class="section-label" style="margin-top:28px">${t('samples')}</div><div class="samplelist">${events.map(e=>`<button class="sample" data-sample="${e.id}"><span class="sampleicon">${icon(e.icon)}</span><span>${t(e.name)}<br><span class="small">${e.id}</span></span><span class="end">${icon(state.beads.some(b=>b.id===e.id)?'check':'arrow')}</span></button>`).join('')}</div><p class="fine">${t('sampleEvent')} · ${t('simNote')}</p></div></div>`;}
const places=[{icon:'explore',x:51,y:56},{icon:'shop',x:28,y:32},{icon:'shop',x:72,y:78},{icon:'star',x:72,y:22}];
function explorePage(){return head('exploreTitle','exploreSub')+`<div class="maplayout"><div class="map"><svg viewBox="0 0 500 490" preserveAspectRatio="none" aria-hidden="true"><rect width="500" height="490" fill="#eae7df"/><path d="M0 370 500 290 500 490 0 490Z" fill="#d4e0e2"/><path d="m-20 80 520 170M120-20 50 500M0 330 500 90M360-20 330 490" stroke="#faf9f6" stroke-width="22" fill="none"/><rect x="170" y="175" width="175" height="128" rx="55" fill="#d7d0dc"/><rect x="197" y="195" width="121" height="87" rx="38" fill="#ebe7ed"/><path d="M228 207v64m25-64v64m25-64v64" stroke="#c8bfce" stroke-width="2"/><rect x="76" y="87" width="74" height="52" rx="8" fill="#d9d1c7"/><rect x="350" y="62" width="69" height="68" rx="8" fill="#d4d8ca"/><rect x="359" y="349" width="88" height="51" rx="8" fill="#d9d1c7"/></svg><span class="map-label">${t('park')}</span>${places.map((p,i)=>`<button class="pin ${i===place?'active':''}" style="left:${p.x}%;top:${p.y}%" data-place="${i}">${icon(p.icon)}${t('place'+i)}</button>`).join('')}<div class="map-scale">${t('mapNote')}</div></div><div><div class="location-card"><span class="pill">${t('demo')}</span><h2>${t('place'+place)}</h2><p>${t('desc'+place)}</p><button class="btn full" id="placeAction">${icon(place===2?'rewards':place===1?'design':'explore')}${t(place===2?'rewards':place===1?'design':'checkin')}</button><p class="fine" style="margin:14px 0 0">${t('locationsDemo')}</p></div><div class="location-select">${places.map((p,i)=>`<button data-place="${i}"><span>${String(i+1).padStart(2,'0')} / ${t('place'+i)}</span>${icon('arrow')}</button>`).join('')}</div></div></div>`;}
function rewardsPage(){return head('rewardTitle','rewardSub')+`<div class="point-banner"><div><div class="eyebrow">${t('balance')}</div><strong>${balance()}</strong><p>${t('earn')}</p></div>${icon('rewards')}</div><div class="section-label">${t('badges')}</div><div class="badgerow">${state.checkins.length?state.checkins.map(id=>{let e=events.find(e=>e.id===id);return `<div class="badge-item">${icon(e.icon)}<div>${t(e.name)}<div class="small muted">${t('attendance')}</div></div></div>`}).join(''):`<p class="muted small">${t('noBadges')}</p>`}</div><div class="rewards-grid">${['coffee','care'].map(id=>{let r=state.rewards.find(r=>r.id===id),cost=id==='coffee'?80:120;return `<div class="reward"><span class="eyebrow">${t('demo')} / ${cost} ${t('points')}</span><h2>${t(id)}</h2><p>${t(id+'Desc')}</p>${r?`<div class="ticket"><span class="small">${t(r.used?'used':'redeemed')}</span><code>${esc(r.code)}</code><button class="btn secondary full" data-use="${id}" ${r.used?'disabled':''}>${t(r.used?'used':'use')}</button></div>`:`<button class="btn full" data-redeem="${id}" ${balance()<cost?'disabled':''}>${t(balance()<cost?'insufficient':'redeem')} ${balance()>=cost?icon('arrow'):''}</button>`}</div>`}).join('')}</div><div class="section-label" style="margin-top:32px">${t('history')}</div>${state.ledger.length?state.ledger.slice().reverse().map(l=>`<div class="historyrow"><span>${t(l.kind)}</span><strong>${l.points>0?'+':''}${l.points}</strong></div>`).join(''):`<p class="small muted">${t('noHistory')}</p>`}`;}
function wire(){document.querySelectorAll('main [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{state.palette=Number(b.dataset.palette);persist();render()});document.querySelectorAll('[data-focal]').forEach(b=>b.onclick=()=>{state.focal=Number(b.dataset.focal);persist();render()});document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>openMemory(b.dataset.memory));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(!busy){mode=b.dataset.mode;render()}});document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{document.getElementById('code').value=b.dataset.sample;document.getElementById('codeError').textContent=''});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{place=Number(b.dataset.place);render()});document.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>redeem(b.dataset.redeem));document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useReward(b.dataset.use));on('saveDesign',()=>{state.design={palette:state.palette,focal:state.focal};persist();toast(t('saved'))});on('reopen',()=>{state.palette=state.design.palette;state.focal=state.design.focal;go('design');toast(t('restoredDesign'))});on('simulate',()=>bindBead(true));on('bind',()=>bindBead(false));on('placeAction',()=>place===1?go('design'):place===2?go('rewards'):checkinModal());}
function on(id,fn){let el=document.getElementById(id);if(el)el.onclick=fn;}
function modal(title,body){lastFocus=document.activeElement;document.getElementById('dialogcontent').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="iconbtn" id="closeModal" aria-label="${t('close')}">${icon('close')}</button></div><div class="modalbody">${body}</div>`;on('closeModal',closeModal);let d=document.getElementById('dialog');if(!d.open)d.showModal();}
function closeModal(){document.getElementById('dialog').close();if(lastFocus?.isConnected)lastFocus.focus();}
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
async function bindBead(sim){if(busy)return;let id=document.getElementById('code').value.trim().toUpperCase(),e=events.find(e=>e.id===id),err=document.getElementById('codeError');if(!e){err.textContent=t('invalid');return}if(state.beads.some(b=>b.id===id)){err.textContent=t('already');return}busy=true;document.querySelectorAll('main button').forEach(b=>b.disabled=true);if(sim){let s=document.getElementById('scanner');s.classList.add('scanning');s.innerHTML=`<div><div class="scanner-symbol">${icon(mode==='nfc'?'nfc':'connect')}</div><h2>${t('scanning')}</h2><div class="progressline"><i></i></div><p>${t('simNote')}</p></div>`;await new Promise(r=>setTimeout(r,1500));}state.beads.push({id,name:'',note:'',date:'',photo:'',linkedAt:new Date().toISOString()});state.ledger.push({kind:'bindEarn',points:40});persist();busy=false;render();modal(t('success'),`<div class="checkmark">${icon('check')}</div><h3 style="text-align:center">${t(e.name)}</h3><p>${t('successText')}</p><button class="btn full" id="viewCollection">${t('view')}</button>`);on('viewCollection',()=>{closeModal();go('collection');openMemory(id)});}
function openMemory(id){let b=state.beads.find(b=>b.id===id),e=events.find(e=>e.id===id),photo=b.photo;modal(t('memoryTitle'),`<span class="pill">${t('sampleEvent')}</span><p>${t(e.name)} · ${id}<br>${t(state.checkins.includes(id)?'attendance':'notattendance')}</p><form id="memoryForm"><label for="memoryName">${t('memoryName')}</label><input id="memoryName" maxlength="80" value="${esc(b.name)}" placeholder="${t(e.name)}"><label for="memoryDate">${t('date')}</label><input id="memoryDate" type="date" value="${esc(b.date)}"><label for="memoryNote">${t('story')}</label><textarea id="memoryNote" maxlength="1200" placeholder="${t('storyHint')}">${esc(b.note)}</textarea><label for="memoryFile">${icon('photo')} ${t('photo')}</label><input type="file" id="memoryFile" accept="image/*"><p class="fine">${t('photoHint')}</p><div id="photoPreview">${photo?`<img class="memory-photo" src="${photo}" alt="${t('memoryTitle')}">`:''}</div><button type="button" class="btn secondary" id="removePhoto" ${photo?'':'hidden'}>${t('removePhoto')}</button><div class="error" id="photoError" role="alert"></div><button class="btn full" type="submit" id="saveMemory">${t('saveMemory')}</button></form>`);on('removePhoto',()=>{photo='';document.getElementById('photoPreview').innerHTML='';document.getElementById('removePhoto').hidden=true;document.getElementById('memoryFile').value=''});document.getElementById('memoryFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;let err=document.getElementById('photoError');if(!f.type.startsWith('image/')||f.size>10*1024*1024){err.textContent=t('imageError');return;}document.getElementById('saveMemory').disabled=true;try{photo=await compressImage(f);document.getElementById('photoPreview').innerHTML=`<img class="memory-photo" src="${photo}" alt="${t('memoryTitle')}">`;document.getElementById('removePhoto').hidden=false;err.textContent='';}catch(e){err.textContent=t('imageError')}finally{document.getElementById('saveMemory').disabled=false}};document.getElementById('memoryForm').onsubmit=ev=>{ev.preventDefault();b.name=document.getElementById('memoryName').value.trim();b.date=document.getElementById('memoryDate').value;b.note=document.getElementById('memoryNote').value.trim();b.photo=photo;persist();closeModal();render();toast(t('memorySaved'))};}
function compressImage(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.8))};im.onerror=()=>{URL.revokeObjectURL(url);reject()};im.src=url;});}
function checkinModal(){if(!state.beads.length){toast(t('needBead'));return;}modal(t('checkin'),`<p>${t('checkinText')}</p><div class="samplelist">${state.beads.map(b=>{let e=events.find(e=>e.id===b.id),done=state.checkins.includes(b.id);return `<button class="sample" data-check="${b.id}" ${done?'disabled':''}><span class="sampleicon">${icon(e.icon)}</span><span>${esc(b.name||t(e.name))}<br><span class="small">${done?t('checkinDone'):'+60 '+t('points')}</span></span><span class="end">${icon(done?'check':'arrow')}</span></button>`}).join('')}</div>`);document.querySelectorAll('[data-check]').forEach(btn=>btn.onclick=()=>{let id=btn.dataset.check;if(!state.checkins.includes(id)){state.checkins.push(id);state.ledger.push({kind:'visitEarn',points:60});persist();closeModal();render();toast(t('checked'))}});}
function redeem(id){let cost=id==='coffee'?80:120;if(balance()<cost||state.rewards.some(r=>r.id===id))return;modal(t('confirmRedeem'),`<h3>${t(id)}</h3><p>${cost} ${t('spend')}</p><p>${t(id+'Desc')}</p><div class="buttonrow"><button class="btn" id="confirmReward">${t('confirm')}</button><button class="btn secondary" id="cancelReward">${t('cancel')}</button></div>`);on('cancelReward',closeModal);on('confirmReward',()=>{if(balance()<cost||state.rewards.some(r=>r.id===id))return;state.rewards.push({id,used:false,code:'DEMO-'+id.toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()});state.ledger.push({kind:'rewardSpend',points:-cost});persist();closeModal();render();toast(t('rewardIssued'))});}
function useReward(id){let r=state.rewards.find(r=>r.id===id);if(!r||r.used)return;modal(t('use'),`<h3>${t(id)}</h3><p>${t(id+'Desc')}</p><code>${r.code}</code><div class="buttonrow"><button class="btn" id="confirmUse">${t('confirm')}</button><button class="btn secondary" id="cancelUse">${t('cancel')}</button></div>`);on('cancelUse',closeModal);on('confirmUse',()=>{r.used=true;persist();closeModal();render();toast(t('rewardUsed'))});}
function help(){modal(t('helpTitle'),`<p>${t('helpIntro')}</p>${[1,2,3,4].map(i=>`<div class="help-step">${t('help'+i)}</div>`).join('')}<p>${t('privacy')}</p><div class="buttonrow"><button class="btn secondary" id="export">${icon('download')}${t('export')}</button><button class="btn secondary" id="import">${t('import')}</button><input type="file" accept="application/json,.json" id="backupFile" hidden></div><button class="btn secondary" id="reset" style="margin-top:20px">${t('reset')}</button>`);on('export',()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='Encore-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});on('import',()=>document.getElementById('backupFile').click());document.getElementById('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>8*1024*1024)throw 0;let s=JSON.parse(await f.text());if(!validState(s)||balanceOf(s)<0)throw 0;state=s;persist();closeModal();render();toast(t('restoreDone'));}catch(e){toast(t('badBackup'))}};on('reset',()=>{modal(t('reset'),`<p>${t('resetAsk')}</p><div class="buttonrow"><button class="btn" id="confirmReset">${t('confirm')}</button><button class="btn secondary" id="cancelReset">${t('cancel')}</button></div>`);on('cancelReset',closeModal);on('confirmReset',()=>{let l=state.lang;state=defaults();state.lang=l;persist();closeModal();go('design');toast(t('resetDone'))})});}
function balanceOf(s){return s.beads.length*40+s.checkins.length*60-s.rewards.reduce((n,r)=>n+(r.id==='coffee'?80:120),0)}

const et=k=>EWORDS[k]?.[langs[state.lang]]||k;
const GEM=[['violet','#a18abc'],['rose','#dfa7b6'],['sky','#91b9d6'],['clear','#d8d6e1'],['jade','#85b4a0'],['amber','#d8b56a'],['coral','#d77b86'],['night','#4d557b'],['silver','#a6a9b7'],['moon','#e4d8bd']];
const BASES=[{name:['Cosmic encore','星际返场','星際返場'],ref:'Coldplay · Music of the Spheres',pattern:[7,0,2,4,5,6,1,3],url:'https://www.kaitaksportspark.com.hk/sc/events-tickets/25'}, {name:['Rose & sky','玫瑰与晴空','玫瑰與晴空'],ref:'SEVENTEEN · [NEW_] · Hong Kong 2026',pattern:[1,2,3,1,2,8],url:'https://www.kaitaksportspark.com.hk/events-tickets/seventeen-world-tour-new-in-hong-kong-2026'}, {name:['Home crowd','主场时刻','主場時刻'],ref:'Hong Kong Sevens 2026',pattern:[4,3,7,4,8,6],url:'https://www.kaitaksportspark.com.hk/events-tickets/15'}];
const zodiacSigns=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const bn=b=>b.name?et(b.name):b.kind?et(b.kind):et('personal');
const baseBeads=(n,p)=>Array.from({length:n},(_,i)=>{const g=GEM[BASES[p].pattern[i%BASES[p].pattern.length]];return{colour:g[1],name:g[0],text:'',kind:'gems'}});
function checkEditor(e){return e&&[10,12,14].includes(e.count)&&[0,1,2].includes(e.preset)&&Array.isArray(e.items)&&e.items.length===e.count&&e.items.every(b=>b===null||b&&/^#[0-9a-fA-F]{6}$/.test(b.colour)&&typeof b.text==='string'&&b.text.length<=6&&(!b.name||GEM.some(g=>g[0]===b.name))&&['gems','member','zodiac','session','date'].includes(b.kind));}
function editor(){if(!checkEditor(state.editor))state.editor={count:12,preset:1,items:baseBeads(12,1)};return state.editor;}
let selected=0,editorTab='gems',historyBack=[],historyForward=[],dragging=null,skipClick=false;
const clone=v=>JSON.parse(JSON.stringify(v));
function edit(fn){historyBack.push(clone(editor()));if(historyBack.length>40)historyBack.shift();historyForward=[];fn(editor());persist();render();}
function ball(b,extra=''){return `<span class="gem ${extra}" style="--gem:${b?.colour||'#eee'}"><span>${esc(b?.text||'')}</span></span>`;}
function ringHTML(e,mini=false){const size=e.count===10?16:e.count===12?14:12;return `<div class="bracelet ${mini?'mini-ring':''}"><div class="thread"></div>${e.items.map((b,i)=>{const a=(i/e.count*360-90)*Math.PI/180;return `<button class="ringbead ${selected===i&&!mini?'chosen':''} ${b?'':'vacant'}" ${mini?'tabindex="-1"':`data-slot="${i}"`} style="left:${50+34*Math.cos(a)}%;top:${50+34*Math.sin(a)}%;width:${size}%;height:${size}%" aria-label="${et('slot')} ${i+1}: ${esc(b?bn(b)+(b.text?' '+b.text:''):et('emptySlot'))}" ${mini?'':`aria-pressed="${selected===i}"`}>${b?ball(b):'<span class="empty-plus">+</span>'}</button>`}).join('')}${mini?'':`<div class="ringcenter"><span class="eyebrow">ENCORE</span><strong>${e.items.filter(Boolean).length}<i> / ${e.count}</i></strong><span>${et('placed')}</span></div>`}</div>`;}
function designPage(){const e=editor();selected=Math.min(selected,e.count-1);const b=e.items[selected];return head('designTitle','designSub')+`<div class="studio-layout"><section class="studio-preview"><div class="studio-top"><span class="eyebrow">STELLA CHAO / CONCEPT</span><span class="small">${e.count} ${et('beadWord')}</span></div>${ringHTML(e)}<div class="preview-caption"><h2>${BASES[e.preset].name[langs[state.lang]]}</h2><p>${et('hint')}</p></div><div class="edit-toolbar"><button id="undoEdit" class="tool" ${historyBack.length?'':'disabled'}>↶ ${et('undo')}</button><button id="redoEdit" class="tool" ${historyForward.length?'':'disabled'}>↷ ${et('redo')}</button><button id="removeBead" class="tool" ${b?'':'disabled'}>− ${et('remove')}</button></div><div class="drop-bin" id="dropBin">${icon('close')} ${et('bin')}</div><div class="selection-caption"><span>${et('slot')} ${String(selected+1).padStart(2,'0')}</span><strong>${b?esc(bn(b)+(b.text?' · '+b.text:'')):et('emptySlot')}</strong></div><p class="fine">${et('newEdit')}</p><p class="fine">${et('sizing')}</p></section><section class="studio-controls"><div class="controlgroup"><div class="section-label">${et('count')}</div><div class="count-row">${[10,12,14].map(n=>`<button data-count="${n}" aria-pressed="${e.count===n}"><strong>${n}</strong><span>${et('beadWord')}</span></button>`).join('')}</div></div><div class="controlgroup"><div class="section-label">${et('preset')}</div><div class="preset-list">${BASES.map((p,i)=>`<button class="preset" data-base="${i}" aria-pressed="${e.preset===i}"><span class="preset-dots">${p.pattern.slice(0,4).map(g=>ball({colour:GEM[g][1]})).join('')}</span><span><strong>${p.name[langs[state.lang]]}</strong><small>${p.ref}</small></span><span>${e.preset===i?'✓':'↗'}</span></button>`).join('')}</div><p class="fine">${et('concept')}</p></div><div class="controlgroup"><div class="section-label">${et('library')}</div><div class="modebar"><button data-etab="gems" class="${editorTab==='gems'?'active':''}">${et('gems')}</button><button data-etab="personal" class="${editorTab==='personal'?'active':''}">${et('personal')}</button></div>${editorTab==='gems'?`<div class="gem-library">${GEM.map((g,i)=>`<button data-gem="${i}" class="gem-choice" aria-label="${et(g[0])}">${ball({colour:g[1]})}<span>${et(g[0])}</span></button>`).join('')}</div>`:`<div class="custom-maker"><div class="custom-row"><div><label for="beadKind">${et('meaning')}</label><select id="beadKind">${['member','zodiac','session','date'].map(k=>`<option value="${k}">${et(k)}</option>`).join('')}</select></div><div><label for="beadColour">${et('colour')}</label><input id="beadColour" type="color" value="${b?.colour||'#dfa7b6'}"></div></div><label id="customLabel" for="beadText">${et('text')}</label><input id="beadText" maxlength="6" value="${esc(b?.text||'')}" placeholder="JH / D1 / 10.04"><select id="zodiacChoice" hidden aria-label="${et('zodiac')}">${zodiacSigns.map(z=>`<option>${z}</option>`).join('')}</select><input id="beadDate" type="date" hidden aria-label="${et('date')}"><p class="fine">${et('customHint')}</p><button id="applyCustom" class="btn secondary full" style="margin-top:14px">${et('add')}</button></div>`}</div><div class="buttonrow"><button id="resetBase" class="tool">${et('resetBase')}</button><button id="fillEmpty" class="tool" ${e.items.every(Boolean)?'disabled':''}>${et('fill')}</button></div><button class="btn full" id="saveDesign" style="margin-top:20px">${icon('check')}${t('save')}</button><button class="btn secondary full" id="exportBracelet" style="margin-top:10px">${icon('download')}${et('download')}</button><p class="fine">${et('draft')}</p><details class="event-sources"><summary>${et('source')}</summary>${BASES.map(p=>`<a href="${p.url}" target="_blank" rel="noopener">${p.ref} ↗</a>`).join('')}</details></section></div>`;}
words.designTitle=['Make it yours.','串起你的故事。','串起你的故事。'];words.designSub=EWORDS.intro;
const oldWire=wire;wire=function(){oldWire();if(page!=='design')return;document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{if(skipClick)return;selected=Number(b.dataset.slot);render()});document.querySelectorAll('[data-gem]').forEach(b=>b.onclick=()=>{if(skipClick)return;const g=GEM[Number(b.dataset.gem)];edit(e=>e.items[selected]={colour:g[1],name:g[0],text:'',kind:'gems'})});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.count);if(n===editor().count)return;confirmEditor(et('resizeAsk'),()=>edit(e=>{e.count=n;e.items=baseBeads(n,e.preset);selected=0}))});document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.base);confirmEditor(et('changeAsk'),()=>edit(e=>{e.preset=p;e.items=baseBeads(e.count,p)}))});document.querySelectorAll('[data-etab]').forEach(b=>b.onclick=()=>{editorTab=b.dataset.etab;render()});on('removeBead',()=>edit(e=>e.items[selected]=null));on('resetBase',()=>confirmEditor(et('changeAsk'),()=>edit(e=>e.items=baseBeads(e.count,e.preset))));on('fillEmpty',()=>edit(e=>{const base=baseBeads(e.count,e.preset);e.items=e.items.map((b,i)=>b||base[i])}));on('undoEdit',()=>{if(!historyBack.length)return;historyForward.push(clone(editor()));state.editor=historyBack.pop();persist();render()});on('redoEdit',()=>{if(!historyForward.length)return;historyBack.push(clone(editor()));state.editor=historyForward.pop();persist();render()});on('saveDesign',()=>{state.savedBracelet=clone(editor());state.design={palette:state.palette,focal:state.focal};persist();toast(et('saved'))});on('applyCustom',()=>{const kind=document.getElementById('beadKind').value;let text=document.getElementById('beadText').value.trim();if(kind==='zodiac')text=document.getElementById('zodiacChoice').value;if(kind==='date'){const v=document.getElementById('beadDate').value;if(!v){document.getElementById('beadDate').reportValidity();return;}text=v.slice(5).replace('-','.')}const colour=document.getElementById('beadColour').value;edit(e=>e.items[selected]={colour,text:text.slice(0,6),kind})});const kind=document.getElementById('beadKind');if(kind)kind.onchange=()=>{document.getElementById('beadText').hidden=['zodiac','date'].includes(kind.value);document.getElementById('zodiacChoice').hidden=kind.value!=='zodiac';document.getElementById('beadDate').hidden=kind.value!=='date';document.getElementById('beadDate').required=kind.value==='date';};on('exportBracelet',exportBracelet);document.querySelectorAll('[data-slot],[data-gem]').forEach(el=>el.onpointerdown=startDrag);};
function confirmEditor(message,action){modal(et('studio'),`<p>${message}</p><div class="buttonrow"><button id="confirmEdit" class="btn">${t('confirm')}</button><button id="cancelEdit" class="btn secondary">${t('cancel')}</button></div>`);on('confirmEdit',()=>{closeModal();action()});on('cancelEdit',closeModal);}
function startDrag(ev){if(ev.button!==0)return;const el=ev.currentTarget;const slot=el.hasAttribute('data-slot')?Number(el.dataset.slot):null;const g=slot===null?GEM[Number(el.dataset.gem)]:null;const bead=slot===null?{colour:g[1],name:g[0],text:'',kind:'gems'}:editor().items[slot];if(!bead)return;dragging={el,slot,bead:clone(bead),x:ev.clientX,y:ev.clientY,id:ev.pointerId,active:false};el.setPointerCapture(ev.pointerId);el.onpointermove=moveDrag;el.onpointerup=endDrag;el.onpointercancel=cancelDrag;}
function moveDrag(ev){const d=dragging;if(!d)return;if(!d.active&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)<7)return;if(!d.active){d.active=true;const ghost=document.createElement('div');ghost.id='dragGhost';ghost.innerHTML=ball(d.bead);document.body.appendChild(ghost);d.el.classList.add('drag-origin');document.getElementById('dropBin').classList.add('ready');}ev.preventDefault();const ghost=document.getElementById('dragGhost');ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-slot],#dropBin');if(target)target.classList.add('drop-target');}
function endDrag(ev){const d=dragging;if(!d)return;const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-slot],#dropBin');const active=d.active;cancelDrag();if(!active)return;skipClick=true;setTimeout(()=>skipClick=false,80);if(target?.hasAttribute('data-slot')){const to=Number(target.dataset.slot);selected=to;if(d.slot===to){render();return;}edit(e=>{if(d.slot!==null)e.items[d.slot]=e.items[to];e.items[to]=d.bead})}else if(target?.id==='dropBin'&&d.slot!==null)edit(e=>e.items[d.slot]=null);}
function cancelDrag(){if(dragging){try{dragging.el.releasePointerCapture(dragging.id)}catch{}dragging.el.classList.remove('drag-origin');}dragging=null;document.getElementById('dragGhost')?.remove();document.querySelectorAll('.drop-target,.ready').forEach(e=>e.classList.remove('drop-target','ready'));}
const oldCollection=collectionPage;collectionPage=function(){let out=oldCollection();if(checkEditor(state.savedBracelet)){out=out.replace(/<div class="mini-story"><span class="num">✧<\/span>[\s\S]*$/,'');out+=`<div class="saved-ring"><div>${ringHTML(state.savedBracelet,true)}</div><div><span class="eyebrow">${et('savedSub')}</span><h2>${BASES[state.savedBracelet.preset].name[langs[state.lang]]}</h2><p>${state.savedBracelet.count} ${et('beadWord')}</p><button class="btn secondary" id="reopen">${t('reopen')}</button></div></div>`;}return out;};
const designWire=wire;wire=function(){designWire();if(page==='collection'&&checkEditor(state.savedBracelet))on('reopen',()=>{state.editor=clone(state.savedBracelet);historyBack=[];historyForward=[];persist();go('design')});};
const originalValidation=validState;validState=function(s){return originalValidation(s)&&(!s.editor||checkEditor(s.editor))&&(!s.savedBracelet||checkEditor(s.savedBracelet));};
function exportBracelet(){const e=editor(),c=document.createElement('canvas');c.width=1200;c.height=1380;const ctx=c.getContext('2d');ctx.fillStyle='#f7f5f0';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#252329';ctx.textAlign='center';ctx.font='64px Georgia';ctx.fillText('encore.',600,115);ctx.font='22px sans-serif';ctx.fillText('STELLA CHAO JEWELRY CONCEPT / TEAM ToT',600,165);ctx.beginPath();ctx.arc(600,670,350,0,Math.PI*2);ctx.strokeStyle='#cbc4c1';ctx.lineWidth=3;ctx.stroke();e.items.forEach((b,i)=>{if(!b)return;const a=i/e.count*Math.PI*2-Math.PI/2,x=600+350*Math.cos(a),y=670+350*Math.sin(a),r=e.count===10?80:e.count===12?68:59;ctx.save();ctx.shadowColor='#25232930';ctx.shadowBlur=18;ctx.shadowOffsetY=14;const g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.32,b.colour);g.addColorStop(.8,b.colour);g.addColorStop(1,'#746777');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#292431';ctx.font=(b.text.length>4?'18':'25')+'px sans-serif';ctx.fillText(b.text,x,y+8)});ctx.font='38px Georgia';ctx.fillStyle='#252329';ctx.fillText(BASES[e.preset].name[0],600,1150);ctx.font='21px sans-serif';ctx.fillText(e.count+' beads / Personal concept design',600,1195);ctx.font='18px sans-serif';ctx.fillStyle='#747078';ctx.fillText('Digital colour preview. Not official event merchandise.',600,1280);const a=document.createElement('a');a.download='Encore-My-Bracelet.png';a.href=c.toDataURL('image/png');a.click();}

document.getElementById('language').onchange=e=>{if(busy){e.target.value=state.lang;return;}state.lang=e.target.value;persist();render()};document.getElementById('help').onclick=help;render();
</script></body></html>
