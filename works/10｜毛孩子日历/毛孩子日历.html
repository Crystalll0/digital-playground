<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>毛孩子日历</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 一本"宠物手帐"——顶部贴纸式宠物切换；左侧是宠物的小房间（可互动），右侧是待办票根；下面是贴纸月历、护理计划与记录。主色取自暹罗猫的蓝眼睛，配奶油黄与蜜桃粉。 */
:root{
  --bg:#F4F2FB; --surface:#FFFFFF; --surface-2:#F8F6FD; --ink:#2A2540; --muted:#7B7594; --line:#ECE8F6;
  --accent:#5B6CF0; --accent-ink:#FFFFFF; --accent-soft:#E8EAFF; --butter:#FFD66B; --peach:#FFB8A6;
  --wall-a:#E6ECFF; --wall-b:#FBEFF6; --floor:#F3E3D3; --rug:#FFCDBE; --rug-2:#FFE3D9; --win:#CFE4FF; --frame:#FFFFFF;
  --c-in:#22A876; --c-out:#139FB3; --c-vac:#8A60F0; --c-chk:#5B6CF0; --c-bday:#EE4F8C; --c-oth:#9C95B5;
  --danger:#E0464C; --danger-soft:#FFE9E9; --ok:#22A876; --ok-soft:#E0F6EC; --warn:#B9770B; --warn-soft:#FFF2D2;
  --paw:rgba(91,108,240,.07);
  --shadow:0 1px 0 rgba(42,37,64,.03),0 14px 34px -16px rgba(42,37,64,.22);
  --f-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans SC",system-ui,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16142A; --surface:#211E39; --surface-2:#2A2645; --ink:#EEEBFA; --muted:#A49EC0; --line:#342F52;
  --accent:#8C98FF; --accent-ink:#16142A; --accent-soft:#2E2F5C; --butter:#F5C94F; --peach:#F29C88;
  --wall-a:#262B55; --wall-b:#33284A; --floor:#3A3050; --rug:#5A3A55; --rug-2:#4A3350; --win:#1B2448; --frame:#3D3863;
  --c-in:#4BCB97; --c-out:#3DC2D4; --c-vac:#AB8BFA; --c-chk:#8C98FF; --c-bday:#F778A8; --c-oth:#A29CBB;
  --danger:#FF7A7F; --danger-soft:#43232C; --ok:#4BCB97; --ok-soft:#1C3A31; --warn:#F2BE55; --warn-soft:#41331A;
  --paw:rgba(140,152,255,.06);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16142A; --surface:#211E39; --surface-2:#2A2645; --ink:#EEEBFA; --muted:#A49EC0; --line:#342F52;
  --accent:#8C98FF; --accent-ink:#16142A; --accent-soft:#2E2F5C; --butter:#F5C94F; --peach:#F29C88;
  --wall-a:#262B55; --wall-b:#33284A; --floor:#3A3050; --rug:#5A3A55; --rug-2:#4A3350; --win:#1B2448; --frame:#3D3863;
  --c-in:#4BCB97; --c-out:#3DC2D4; --c-vac:#AB8BFA; --c-chk:#8C98FF; --c-bday:#F778A8; --c-oth:#A29CBB;
  --danger:#FF7A7F; --danger-soft:#43232C; --ok:#4BCB97; --ok-soft:#1C3A31; --warn:#F2BE55; --warn-soft:#41331A;
  --paw:rgba(140,152,255,.06);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -16px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  background-image:radial-gradient(circle at 12px 12px,var(--paw) 0 5px,transparent 6px),radial-gradient(circle at 4px 3px,var(--paw) 0 2.4px,transparent 3px),radial-gradient(circle at 12px 1px,var(--paw) 0 2.4px,transparent 3px),radial-gradient(circle at 20px 3px,var(--paw) 0 2.4px,transparent 3px);
  background-size:72px 72px;background-position:0 0,0 0,0 0,0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1{font-family:var(--f-display);font-size:34px;letter-spacing:.03em;display:flex;align-items:center;gap:10px;line-height:1.1}
h1 .logo{width:42px;height:42px;border-radius:14px;background:var(--butter);display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 6px 14px -6px rgba(185,119,11,.6)}
h1 .logo svg{width:26px;height:26px}
h2{font-family:var(--f-display);font-size:21px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:8px}
.top .sub b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.syncnote{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);padding:5px 12px;border-radius:999px;box-shadow:var(--shadow)}
.syncnote i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.syncnote.local i{background:var(--warn)}

.switch{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 10px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:9px;padding:5px 16px 5px 5px;border-radius:999px;border:0;background:var(--surface);white-space:nowrap;flex:none;box-shadow:var(--shadow);font-weight:500;transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip .mini{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);overflow:hidden;flex:none}
.chip .mini svg{width:100%;height:100%;display:block}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.chip[aria-pressed="true"] .mini{background:var(--surface)}
.chip.add{padding:5px 18px;color:var(--accent);background:transparent;box-shadow:none;border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}

.btn{border:0;background:var(--surface-2);border-radius:999px;padding:7px 16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s;color:var(--ink)}
.btn:hover{background:var(--accent-soft);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:4px 12px;font-size:12.5px}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.done-btn{background:var(--ok-soft);color:var(--ok)}
.btn.done-btn:hover{background:var(--ok);color:#fff}

.card{min-width:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 22px 0;flex-wrap:wrap}
.card-b{padding:14px 22px 22px}
.hicon{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.hicon svg{width:18px;height:18px}

.grid-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:880px){.grid-top{grid-template-columns:minmax(0,1fr)}}

/* profile: a little room */
.profile{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding:14px}
@media (max-width:600px){.profile{grid-template-columns:minmax(0,1fr)}}
.stagecol{display:flex;flex-direction:column;gap:12px}
.room{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--wall-a),var(--wall-b) 72%,var(--floor) 72%);aspect-ratio:27/30;max-width:100%}
.room .win{position:absolute;right:14px;top:16px;width:62px;height:70px;border-radius:30px 30px 6px 6px;background:var(--win);border:5px solid var(--frame);overflow:hidden}
.room .win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--frame);transform:translateX(-50%)}
.room .win .orb{position:absolute;left:12px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--butter);box-shadow:0 0 18px var(--butter)}
.room .win.night .orb{background:#F5F0D8;box-shadow:inset -5px -3px 0 0 var(--win),0 0 12px rgba(245,240,216,.5)}
.room .frame{position:absolute;left:18px;top:22px;width:44px;height:36px;border-radius:6px;background:var(--surface);transform:rotate(-5deg);box-shadow:0 4px 10px -6px rgba(0,0,0,.3);display:grid;place-items:center;font-family:var(--f-display);font-size:11px;color:var(--c-bday)}
.room .rug{position:absolute;left:50%;bottom:5%;width:82%;height:16%;border-radius:50%;transform:translateX(-50%);background:repeating-radial-gradient(ellipse at center,var(--rug) 0 8px,var(--rug-2) 8px 14px)}
.room .bowl{position:absolute;left:12px;bottom:8%;width:40px;height:16px;border-radius:4px 4px 20px 20px;background:var(--accent)}
.room .bowl::before{content:"";position:absolute;left:4px;right:4px;top:-4px;height:7px;border-radius:50%;background:#C98A55}
.stage{position:absolute;left:50%;bottom:6%;width:84%;transform:translateX(-50%);aspect-ratio:200/256;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage .pet{position:absolute;inset:0;cursor:grab}
.stage .pet svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 95%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.022)}}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pet .tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(9deg)}}
.pet.happy .tail,.pet.jump .tail{animation-duration:.5s}
.pet .eyes-happy{display:none}
.pet.happy .eyes{display:none}.pet.happy .eyes-happy{display:inline}
.pet .pxmouth{opacity:0}.pet.chomp .pxmouth{opacity:1}
.pet .tongue{display:none}.pet.happy .tongue,.pet.chomp .tongue{display:inline}
.pet .blush{transition:opacity .3s}.pet.happy .blush{opacity:.8}
.pet.tilt svg{animation:tilt .9s ease-in-out}
@keyframes tilt{25%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}100%{transform:rotate(0)}}
.pet.jump svg{animation:jump .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-30px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
.pet.chomp .mouth{transform-box:fill-box;transform-origin:center top;animation:chomp .25s 4 alternate}
@keyframes chomp{to{transform:scaleY(1.9)}}
.pet.shake svg{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.fx{position:absolute;pointer-events:none;left:50%;top:20%;font-weight:700}
.heart{animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{transform:translate(var(--dx),0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(calc(var(--dx)*1.6),-90px) scale(1.1);opacity:0}}
.food{top:-10%;animation:drop .7s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes drop{0%{transform:translate(-50%,0)}80%{transform:translate(-50%,120px);opacity:1}100%{transform:translate(-50%,128px) scale(.4);opacity:0}}
.toy{top:auto;bottom:20%;animation:toy 1s ease-in-out forwards}
@keyframes toy{0%{transform:translate(70px,0) rotate(0)}50%{transform:translate(-80px,-60px) rotate(-30deg)}100%{transform:translate(60px,-10px) rotate(20deg);opacity:0}}
.bubble{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:var(--surface);padding:6px 14px;border-radius:16px;font-size:13.5px;white-space:nowrap;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);font-weight:500;z-index:2}
.bubble[data-off]{opacity:0;transform:translateX(-50%) translateY(6px)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:0;border-radius:16px;padding:9px 2px 7px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;transition:transform .15s}
.act svg{width:22px;height:22px}
.act:hover{transform:translateY(-2px)}
.act:active{transform:scale(.93)}
.act[data-act="pet"]{background:color-mix(in srgb,var(--c-bday) 14%,var(--surface));color:var(--c-bday)}
.act[data-act="feed"]{background:color-mix(in srgb,var(--butter) 30%,var(--surface));color:var(--warn)}
.act[data-act="play"]{background:color-mix(in srgb,var(--c-in) 14%,var(--surface));color:var(--c-in)}
.act[data-act="talk"]{background:var(--accent-soft);color:var(--accent)}
.bond{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.bond .bar{flex:1;max-width:120px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bond .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--c-bday));border-radius:4px;transition:width .4s}

.info{min-width:0;display:flex;flex-direction:column;gap:14px;padding:8px 8px 8px 0}
@media (max-width:600px){.info{padding:4px}}
.info-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.info-h .btn{white-space:nowrap}
.info-h h2{font-size:32px;line-height:1.15}
.info-h .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-family:var(--f-body);transform:rotate(-4deg);display:inline-block}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:0}
.facts div{min-width:0;background:var(--surface-2);border-radius:14px;padding:9px 12px;cursor:text;transition:box-shadow .15s}
[data-f]:hover{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.facts div:hover dt::after,.notes:hover::after{content:' ✎';color:var(--accent)}
.ie{width:100%;min-width:0;border:2px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:3px 6px}
textarea.ie{resize:vertical}
.notes{cursor:text;border-radius:0 10px 10px 0}
.notes .ph{opacity:.7}
.facts dt{font-size:11.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;font-size:15px}
.facts dd small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.photo{width:60px;height:60px;border-radius:18px;object-fit:cover;border:3px solid var(--surface);box-shadow:var(--shadow);transform:rotate(4deg);flex:none}
.notes{font-size:13px;color:var(--muted);border-left:3px solid var(--butter);padding:2px 0 2px 12px;white-space:pre-wrap;overflow-wrap:anywhere}

/* upcoming: tickets */
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.up li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:stretch;background:var(--surface-2);border-radius:16px;overflow:hidden}
.dateb{text-align:center;line-height:1.1;padding:10px 4px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);border-right:2px dashed var(--surface);display:flex;flex-direction:column;justify-content:center}
.dateb b{display:block;font-size:20px;font-family:var(--f-num);font-weight:600}
.dateb span{font-size:11px;opacity:.85}
.up .t{min-width:0;padding:9px 12px;display:flex;align-items:center;gap:10px}
.up .t>div{min-width:0}
.up .mini{width:34px;height:34px;border-radius:50%;background:var(--surface);overflow:hidden;flex:none}
.up .mini svg{width:100%;height:100%;display:block}
.up .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .go{display:flex;align-items:center;padding-right:10px}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.over{background:var(--danger-soft);color:var(--danger)}
.pill.today{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.pill.later{background:var(--surface);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.ticon{width:26px;height:26px;border-radius:9px;display:inline-grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.ticon svg{width:15px;height:15px}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .m{font-family:var(--f-display);font-size:21px;min-width:120px;text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:12.5px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 2px 6px -2px rgba(0,0,0,.15)}
.round{width:32px;height:32px;padding:0;justify-content:center;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{padding:2px 6px 4px;font-size:12px;color:var(--muted);text-align:center;font-weight:500}
.cal .wd.we{color:var(--c-bday)}
.cell{min-height:96px;padding:6px;border-radius:14px;background:var(--surface-2);border:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s}
.cell:hover{background:var(--accent-soft)}
.cell.out{background:transparent}.cell.out .d{opacity:.4}
.cell .d{font-size:13px;font-family:var(--f-num);font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.is-today .d{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.ev{font-size:11px;line-height:1.35;padding:2px 6px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));font-weight:600;display:flex;align-items:center;gap:3px}
.ev svg{width:11px;height:11px;flex:none}
.ev.done{opacity:.55;text-decoration:line-through}
.ev.over{background:var(--danger-soft);color:var(--danger)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}
@media (max-width:640px){.cal{gap:3px}.cell{min-height:56px;padding:4px;border-radius:10px}.cell .d{width:22px;height:22px;font-size:12px}.ev,.more{display:none}.dots{display:flex}}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.legend .ticon{width:20px;height:20px;border-radius:50%}.legend .ticon svg{width:12px;height:12px}
.daylist{margin-top:14px;padding:14px 16px;background:var(--surface-2);border-radius:18px}
.daylist h3{font-size:15px;font-family:var(--f-display);margin-bottom:8px}
.daylist ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.daylist li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.grid-bot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:880px){.grid-bot{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px}
th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:0 10px;white-space:nowrap}
td{padding:10px;vertical-align:middle;white-space:nowrap;background:var(--surface-2)}
td:first-child{border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}
td.name{white-space:normal;min-width:130px}
td.name .nm{display:flex;align-items:center;gap:8px}
td.name b{font-weight:600}
.rowacts{display:flex;gap:4px;justify-content:flex-end}
.logs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;max-height:400px;overflow:auto;position:relative}
.logs li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.logs li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:38px;bottom:-10px;width:2px;background:var(--line)}
.logs .t{min-width:0}.logs .t span{font-size:12px;color:var(--muted);display:block;overflow-wrap:anywhere}
.logs .t .num{display:inline;font-size:12px;color:var(--muted);margin-left:6px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13.5px}

.welcome{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center;padding:22px}
@media (max-width:600px){.welcome{grid-template-columns:minmax(0,1fr);text-align:center}}
.welcome h2{font-size:28px;margin-bottom:8px;display:block}
.welcome p{margin:0 0 16px;max-width:46ch}
.welcome .room{width:240px;max-width:100%;margin:0 auto}

.ov{position:fixed;inset:0;background:rgba(22,20,42,.5);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:26px;width:min(780px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.modal.sm{width:min(470px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px}
.modal-b{padding:12px 22px 18px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:space-between;gap:8px;padding:14px 22px 20px;flex-wrap:wrap}
.modal-f .r{display:flex;gap:8px;margin-left:auto}
.editor{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;background:var(--surface-2);border-radius:20px;padding:14px}
@media (max-width:600px){.editor{grid-template-columns:minmax(0,1fr)}}
.preview{display:flex;flex-direction:column;align-items:center;gap:10px}
.preview .room{width:200px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}
.fields .full{grid-column:1/-1}
@media (max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0;font-weight:500}
.f input,.f select,.f textarea{border:2px solid transparent;background:var(--surface-2);border-radius:12px;padding:8px 12px;color:var(--ink);font-size:14px;width:100%;min-width:0;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.f textarea{min-height:64px;resize:vertical}
.group-t{font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:0;background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent);transform:scale(1.1)}
.sw-custom{width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden}
.swl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swl small{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:60;transition:opacity .3s,transform .3s;max-width:calc(100% - 32px)}
.toast[data-off]{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const utc=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const diff=(a,b)=>Math.round((utc(a)-utc(b))/864e5);
const WD=['日','一','二','三','四','五','六'];
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function addIv(base,k,every,unit){
  if(unit==='day'){const d=new Date(base);d.setDate(d.getDate()+k*every);return d}
  const months=(unit==='year'?12:1)*every*k;
  const t=new Date(base.getFullYear(),base.getMonth()+months,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(base.getDate(),last));return t;
}
const UNIT={day:'天',month:'个月',year:'年'};
const TYPES={
  in:{label:'体内驱虫',c:'var(--c-in)'},
  out:{label:'体外驱虫',c:'var(--c-out)'},
  vac:{label:'疫苗',c:'var(--c-vac)'},
  chk:{label:'体检',c:'var(--c-chk)'},
  bday:{label:'生日',c:'var(--c-bday)'},
  oth:{label:'其他',c:'var(--c-oth)'}
};
const TICON={
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9.5 9 15 14.5"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  vac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4M20 4l-4 4M15 5l4 4M17 7 8 16l-3-.5-.5-3L13.5 3.5M10 8l2 2M7.5 10.5l2 2M5 19l-3 3"/></svg>',
  chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
  bday:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V13a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M2 21h20M4 16c2 1.5 4 1.5 5.3 0 1.4 1.5 4 1.5 5.4 0 1.3 1.5 3.3 1.5 5.3 0M12 11V7M12 7c-1-1-1-2.5 0-4 1 1.5 1 3 0 4z"/></svg>',
  oth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>'
};
const tic=(t,cls='ticon')=>`<span class="${cls}" style="--c:${(TYPES[t]||TYPES.oth).c}">${TICON[t]||TICON.oth}</span>`;
const SPECIES={cat:'猫',dog:'狗',rabbit:'兔',hamster:'仓鼠'};
function defaultPlans(sp){
  const p=[
    {type:'out',title:'体外驱虫',every:1,unit:'month'},
    {type:'in',title:'体内驱虫',every:3,unit:'month'},
    {type:'vac',title:sp==='dog'?'犬联苗加强':'猫三联加强',every:1,unit:'year'},
    {type:'chk',title:'年度体检',every:1,unit:'year'}
  ];
  if(sp==='dog')p.splice(3,0,{type:'vac',title:'狂犬疫苗',every:1,unit:'year'});
  const q=(sp==='rabbit'||sp==='hamster')?[{type:'chk',title:'年度体检',every:1,unit:'year'},{type:'in',title:'体内驱虫',every:6,unit:'month'}]:p;
  return q.map(x=>({...x,id:uid(),last:'',start:''}));
}
function nextDue(pl){
  if(pl.last)return fmt(addIv(parse(pl.last),1,+pl.every||1,pl.unit));
  return pl.start||null;
}
function occ(pl,from,to){
  const base=pl.last?parse(pl.last):(pl.start?parse(pl.start):null);if(!base)return[];
  const out=[];let k=pl.last?1:0;
  for(let g=0;g<800;g++,k++){const d=fmt(addIv(base,k,+pl.every||1,pl.unit));if(d>to)break;if(d>=from)out.push(d)}
  return out;
}
function bdayIn(pet,year){
  if(!pet.birthday)return null;const[,m,d]=pet.birthday.split('-').map(Number);
  const last=new Date(year,m,0).getDate();return `${year}-${pad(m)}-${pad(Math.min(d,last))}`;
}
function nextBday(pet){
  if(!pet.birthday)return null;const t=today();const y=+t.slice(0,4);
  let b=bdayIn(pet,y);if(b<t)b=bdayIn(pet,y+1);return b;
}
function ageText(b){
  if(!b)return '—';const t=parse(today()),d=parse(b);
  let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth();if(t.getDate()<d.getDate())m--;
  if(m<0)return '还没出生';if(m<1)return `${diff(today(),b)} 天`;
  const y=Math.floor(m/12),r=m%12;return (y?`${y} 岁`:'')+(r?` ${r} 个月`:'');
}
function status(due){
  if(!due)return{cls:'later',txt:'待设置'};
  const n=diff(due,today());
  if(n<0)return{cls:'over',txt:`逾期 ${-n} 天`};
  if(n===0)return{cls:'today',txt:'今天'};
  if(n<=14)return{cls:'soon',txt:`${n} 天后`};
  return{cls:'later',txt:`${n} 天后`};
}
function toast(msg){const t=$('#toast');t.textContent=msg;delete t.dataset.off;clearTimeout(toast.h);toast.h=setTimeout(()=>t.dataset.off='',1800)}

/* ---------- avatar ---------- */
function mix(hex,w,amt){
  const h=x=>parseInt(x,16);const a=hex.replace('#',''),b=w.replace('#','');
  const c=[0,2,4].map(i=>Math.round(h(a.substr(i,2))*(1-amt)+h(b.substr(i,2))*amt));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
let avN=0;
const CAT_PX=[
'.....oo.......oo.....',
'....occo.....occo....',
'....oKKoooooooKKo....',
'....oKcccccccccKo....',
'...occccccccccccco...',
'...occccccccccccco...',
'.--occEcccccccEcco--.',
'...occEcccNcccEcco...',
'.--oBBcccccccccBBo--.',
'....occccccccccco....',
'.....ooooooooooo.....'
];
function catSvg(L,full,id,dark,pink){
  const {coat,point:pt,eye,pattern:pat}=L;const OR='#F6B33C',OUT='#1F1B1F',W='#FFFFFF';
  const vee=(x,y)=>y>=4&&Math.abs(x-10)<=(y-3.4)*1.0; // white blaze from forehead down
  const low=(x,y)=>y>=8;
  const color=(ch,x,y)=>{
    if(ch==='o'||ch==='-')return OUT;
    if(ch==='K')return '#F9C3D2';if(ch==='B')return '#F8B4C6';if(ch==='N')return '#EE8FA6';
    if(pat==='solid')return coat;
    if(pat==='points'){
      if((y>=6&&y<=8&&x>=5&&x<=15)||(y===5&&x>=7&&x<=13))return pt;
      if((y===9&&x>=7&&x<=13))return mix(coat,pt,.35);
      if(y<=1||(y===3&&(x===6||x===14)))return mix(coat,pt,.6);
      return coat;
    }
    if(pat==='tuxedo')return (vee(x,y)||low(x,y))?coat:pt;
    if(pat==='tabby'){
      const dk=mix(coat,pt,.55);
      if(y>=4&&y<=5&&(x===8||x===10||x===12))return dk;
      if((x===4||x===16)&&(y===6||y===8))return dk;
            if(vee(x,y)&&y>=6||low(x,y))return mix(coat,'#ffffff',.7);
      return coat;
    }
    if(pat==='calico'){
      if(vee(x,y)||low(x,y))return W===coat?W:coat;
      return x<=10?OR:pt;
    }
    if(pat==='spots'){
      if(!vee(x,y)&&!low(x,y)&&x>=11)return pt;
      return coat;
    }
    return coat;
  };
  let base='';
  CAT_PX.forEach((row,y)=>{
    let x=0;
    while(x<row.length){
      const ch=row[x];if(ch==='.'||ch==='E'){x++;continue}
      const col=color(ch,x,y);let w=1;
      while(x+w<row.length&&row[x+w]!=='.'&&row[x+w]!=='E'&&color(row[x+w],x+w,y)===col)w++;
      base+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${col}"/>`;x+=w;
    }
  });
  const dk=c=>{const h=c.replace('#','');const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return (v[0]*299+v[1]*587+v[2]*114)/1000<70};
  const eyeOnDark=dk(color('c',6,6));
  const eyes=`<g class="eyes"><rect x="6" y="6" width="1" height="2" fill="${eye}"/><rect x="14" y="6" width="1" height="2" fill="${eye}"/></g>`;
  const hap=eyeOnDark?'#E9E4EC':OUT;
  const happy=`<g class="eyes-happy" fill="${hap}"><rect x="5" y="7" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="13" y="7" width="1" height="1"/><rect x="14" y="6" width="1" height="1"/><rect x="15" y="7" width="1" height="1"/></g>`;
  const mouth=`<rect class="pxmouth" x="10" y="8" width="1" height="1" fill="${hap}"/>`;
  const vb=full?'-1 -2 23 15':'0 -1 21 13';
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMax meet" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g>${base}${eyes}${happy}${mouth}</g></svg>`;
}
function avatar(pet,full){
  const L={coat:'#F1E4CC',point:'#4A3426',pattern:'solid',eye:'#4C8DF6',ear:'up',...(pet.look||{})};
  const sp=pet.species||'cat';const id='a'+(++avN);
  const coat=L.coat,pt=L.point,eye=L.eye,pat=L.pattern;
  const dark='#1E1A1A',pink='#EE9AAA';
  let head,ears='',extra='',eyes,happy,nose,clip;
  const gradient=`<radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${pt}" stop-opacity=".95"/><stop offset=".55" stop-color="${pt}" stop-opacity=".7"/><stop offset="1" stop-color="${pt}" stop-opacity="0"/></radialGradient>`;
  const earFill=pat==='points'||pat==='calico'||pat==='tuxedo'?pt:coat;
  if(sp==='cat')return catSvg(L,full,id,dark,pink);
  if(sp==='cat'){
    clip=`<ellipse cx="100" cy="108" rx="64" ry="56"/>`;
    ears=`<path d="M44 86 L58 22 Q62 18 68 22 L98 60Z" fill="${earFill}"/><path d="M156 86 L142 22 Q138 18 132 22 L102 60Z" fill="${pat==='calico'?'#E39A4E':earFill}"/>
      <path d="M56 70 L63 36 L84 60Z" fill="${pink}" opacity=".7"/><path d="M144 70 L137 36 L116 60Z" fill="${pink}" opacity=".7"/>`;
    eyes=`<g class="eyes"><ellipse cx="75" cy="102" rx="12" ry="13" fill="${eye}"/><ellipse cx="125" cy="102" rx="12" ry="13" fill="${eye}"/>
      <ellipse cx="75" cy="103" rx="3.6" ry="10" fill="${dark}"/><ellipse cx="125" cy="103" rx="3.6" ry="10" fill="${dark}"/>
      <circle cx="79" cy="97" r="2.6" fill="#fff"/><circle cx="129" cy="97" r="2.6" fill="#fff"/></g>`;
    nose=`<path d="M94 121 L106 121 L100 128Z" fill="${pink}"/>
      <path class="mouth" d="M100 128 Q100 135 92 135 M100 128 Q100 135 108 135" stroke="${dark}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <g stroke="${mix(coat,'#000000',.45)}" stroke-width="1.6" stroke-linecap="round" opacity=".55"><path d="M70 124 L36 118 M70 129 L36 132 M130 124 L164 118 M130 129 L164 132"/></g>`;
  }else if(sp==='dog'){
    clip=`<ellipse cx="100" cy="108" rx="62" ry="58"/>`;
    const ef=pat==='solid'?mix(coat,'#000000',.18):pt;
    ears=L.ear==='down'
      ?`<ellipse cx="44" cy="104" rx="20" ry="40" transform="rotate(18 44 104)" fill="${ef}"/><ellipse cx="156" cy="104" rx="20" ry="40" transform="rotate(-18 156 104)" fill="${ef}"/>`
      :`<path d="M46 80 Q44 26 66 24 Q84 30 94 60Z" fill="${ef}"/><path d="M154 80 Q156 26 134 24 Q116 30 106 60Z" fill="${ef}"/><path d="M58 66 Q58 40 68 36 Q78 42 84 58Z" fill="${pink}" opacity=".6"/><path d="M142 66 Q142 40 132 36 Q122 42 116 58Z" fill="${pink}" opacity=".6"/>`;
    extra=`<ellipse cx="100" cy="134" rx="32" ry="24" fill="${mix(coat,'#ffffff',.55)}"/>`;
    eyes=`<g class="eyes"><circle cx="74" cy="100" r="10" fill="${eye}"/><circle cx="126" cy="100" r="10" fill="${eye}"/><circle cx="74" cy="101" r="6" fill="${dark}"/><circle cx="126" cy="101" r="6" fill="${dark}"/><circle cx="77" cy="97" r="2.4" fill="#fff"/><circle cx="129" cy="97" r="2.4" fill="#fff"/></g>`;
    nose=`<ellipse cx="100" cy="123" rx="11" ry="8" fill="${dark}"/><path class="mouth" d="M100 130 V138 M100 138 Q92 145 86 140 M100 138 Q108 145 114 140" stroke="${dark}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }else if(sp==='rabbit'){
    clip=`<ellipse cx="100" cy="116" rx="56" ry="52"/>`;
    const ef=pat==='solid'?coat:pt;
    ears=L.ear==='down'
      ?`<ellipse cx="54" cy="104" rx="15" ry="44" transform="rotate(14 54 104)" fill="${ef}"/><ellipse cx="146" cy="104" rx="15" ry="44" transform="rotate(-14 146 104)" fill="${ef}"/>`
      :`<ellipse cx="78" cy="42" rx="14" ry="44" transform="rotate(-8 78 42)" fill="${ef}"/><ellipse cx="122" cy="42" rx="14" ry="44" transform="rotate(8 122 42)" fill="${ef}"/><ellipse cx="78" cy="44" rx="6" ry="32" transform="rotate(-8 78 44)" fill="${pink}" opacity=".7"/><ellipse cx="122" cy="44" rx="6" ry="32" transform="rotate(8 122 44)" fill="${pink}" opacity=".7"/>`;
    eyes=`<g class="eyes"><circle cx="76" cy="110" r="9" fill="${eye}"/><circle cx="124" cy="110" r="9" fill="${eye}"/><circle cx="76" cy="111" r="5" fill="${dark}"/><circle cx="124" cy="111" r="5" fill="${dark}"/><circle cx="79" cy="107" r="2.2" fill="#fff"/><circle cx="127" cy="107" r="2.2" fill="#fff"/></g>`;
    nose=`<path d="M95 128 L105 128 L100 133Z" fill="${pink}"/><path class="mouth" d="M100 133 V138 M100 138 Q95 142 91 139 M100 138 Q105 142 109 139" stroke="${dark}" stroke-width="2" fill="none" stroke-linecap="round"/><rect class="tongue" x="96" y="139" width="8" height="7" rx="1.5" fill="#fff" stroke="${dark}" stroke-width="1"/>`;
  }else{ // hamster

let pets=[],selId=null,mode='connecting',col=null,chains={};
const LKEY='petcal.v1';
function loadLocal(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(pets))}catch(e){}}
const strip=p=>{const {id,...rest}=p;return JSON.parse(JSON.stringify(rest))};
function persist(p){
  if(mode==='db'){
    const data=strip(p);
    chains[p.id]=(chains[p.id]||Promise.resolve()).then(()=>col.doc(p.id).set(data)).catch(e=>{toast('保存失败：'+(e&&e.code==='permission_denied'?'你没有修改权限':'请稍后再试'))});
  }else saveLocal();
}
function removePet(id){
  pets=pets.filter(p=>p.id!==id);if(selId===id)selId=pets[0]?.id||null;
  if(mode==='db')(chains[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(()=>toast('删除失败，请稍后再试'));else saveLocal();
  render();
}
function savePet(p){
  const i=pets.findIndex(x=>x.id===p.id);if(i<0)pets.push(p);else pets[i]=p;
  persist(p);render();
}
function setSync(kind,text){const s=$('#sync');s.className='syncnote'+(kind==='local'?' local':'');s.querySelector('span').textContent=text}

async function init(){
  render();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){mode='local';pets=loadLocal();selId=pets[0]?.id||null;setSync('local','仅保存在这台设备的浏览器里');render();return}
  mode='db';col=db.collection('pets');setSync('ok','正在读取…');
  let first=true;const timer=setTimeout(()=>{if(first)setSync('local','暂时连不上，数据可能不是最新的')},10000);
  col.onSnapshot(snap=>{
    pets=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync('ok','已同步，换设备打开也在')}
    if(!selId||!pets.some(p=>p.id===selId))selId=pets[0]?.id||null;
    first=false;render();
  },err=>{clearTimeout(timer);setSync('local','同步中断：'+(err&&err.message||'请刷新页面'));});
}

function bindInline(p){
  document.querySelectorAll('#info [data-f]').forEach(box=>{
    box.tabIndex=0;
    const start=()=>{
      if(box.querySelector('.ie'))return;
      const f=box.dataset.f,t=box.dataset.t,v=p[f]||'';
      const tgt=box.tagName==='DIV'&&box.classList.contains('notes')?box:box.querySelector('dd');
      const old=tgt.innerHTML;
      tgt.innerHTML=t==='area'?`<textarea class="ie" rows="3">${esc(v)}</textarea>`:`<input class="ie" ${t==='date'?'type="date"':t==='decimal'?'inputmode="decimal"':''} value="${esc(v)}">`;
      const inp=tgt.querySelector('.ie');inp.focus();
      let done=false;
      const finish=save=>{if(done)return;done=true;const nv=inp.value.trim();
        if(save&&nv!==(p[f]||'')){p[f]=nv;delete p.example;savePet(p);toast('已保存')}else tgt.innerHTML=old;};
      inp.addEventListener('blur',()=>finish(true));
      inp.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Enter'&&t!=='area'){e.preventDefault();finish(true)}});
    };
    box.addEventListener('click',start);
    box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!box.querySelector('.ie')){e.preventDefault();start()}});
  });
}

  pv.className='pet';void pv.offsetWidth;pv.className='pet '+cls;
  clearTimeout(interact.t);interact.t=setTimeout(()=>{pv.className='pet'},kind==='pet'?1600:1100);
  let line;
  if(kind==='poke')line=pick(sp==='cat'?['喵？！','别戳我','哼']:sp==='dog'?['汪？','在呢在呢']:['！','（吓一跳）']);
  else if(kind==='talk'&&sp==='cat'&&/暹罗/.test(p.breed||'')&&Math.random()<.6)line=pick(SIAMESE);
  else line=pick(SAY[sp][kind]);
  const b=$('#bubble');b.textContent=line;delete b.dataset.off;clearTimeout(b.t);b.t=setTimeout(()=>b.dataset.off='',1800);
  if(kind==='pet')for(let i=0;i<4;i++){const h=document.createElement('span');h.className='fx heart';h.style.setProperty('--dx',(i*22-33)+'px');h.style.animationDelay=(i*.12)+'s';h.innerHTML=heartSvg;stage.appendChild(h);setTimeout(()=>h.remove(),1700)}
  if(kind==='feed'){const f=document.createElement('span');f.className='fx food';f.innerHTML=FOOD[sp];stage.appendChild(f);setTimeout(()=>f.remove(),800)}
  if(kind==='play'){const t=document.createElement('span');t.className='fx toy';t.innerHTML=TOY[sp]||TOY.dog;stage.appendChild(t);setTimeout(()=>t.remove(),1100)}
  if(kind==='poke')return;
  const bond=p.bond&&p.bond.date===today()?p.bond:{date:today(),n:0,total:(p.bond&&p.bond.total)||0};
  p.bond={date:today(),n:bond.n+1,total:(bond.total||0)+1};
  const lvl=Math.min(100,p.bond.n*10);$('#bond').innerHTML=`<span>今日亲密</span><span class="bar"><b style="width:${lvl}%"></b></span><span class="num">${p.bond.n} 次</span>`;
  clearTimeout(bondTimer);const pid=p.id;bondTimer=setTimeout(()=>{const q=pets.find(x=>x.id===pid);if(q)persist(q)},1500);
}

function upcomingItems(){
  const items=[];const t=today();
  pets.forEach(p=>{
    (p.plans||[]).forEach(pl=>{const d=nextDue(pl);items.push({pet:p,plan:pl,date:d,type:pl.type,title:pl.title})});
    const nb=nextBday(p);if(nb)items.push({pet:p,date:nb,type:'bday',title:`${ageNum(p,nb)} 岁生日`});
  });
  return items.filter(i=>i.date&&diff(i.date,t)<=90).sort((a,b)=>a.date.localeCompare(b.date));
}

function markDone(pid,plid,date){
  const p=pets.find(x=>x.id===pid);const pl=p&&(p.plans||[]).find(x=>x.id===plid);if(!pl)return;
  date=date||today();pl.last=date;
  p.logs=[{id:uid(),date,type:pl.type,title:pl.title,note:''},...(p.logs||[])].slice(0,300);
  savePet(p);toast(`已记录：${p.name} ${pl.title}，下次 ${nextDue(pl)}`);
}

function eventsBetween(from,to){
  const list=calScope==='one'&&cur()?[cur()]:pets;const map={};const t=today();
  const push=(d,e)=>{(map[d]=map[d]||[]).push(e)};
  list.forEach(p=>{
    (p.plans||[]).forEach(pl=>{const nd=nextDue(pl);occ(pl,from,to).forEach(d=>push(d,{pet:p,type:pl.type,title:pl.title,over:d===nd&&d<t,plan:pl}))});
    (p.logs||[]).forEach(l=>{if(l.date>=from&&l.date<=to)push(l.date,{pet:p,type:l.type,title:l.title,done:true})});
    if(p.birthday)for(let y=+from.slice(0,4);y<=+to.slice(0,4);y++){const b=bdayIn(p,y);if(b>=from&&b<=to&&b>=p.birthday)push(b,{pet:p,type:'bday',title:b===p.birthday?'出生':`${y-+p.birthday.slice(0,4)} 岁生日`})}
  });
  return map;
}
function renderCal(){
  const el=$('#calc');const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1);const offset=(first.getDay()+6)%7;
  const start=new Date(y,m,1-offset);const days=Math.ceil((offset+new Date(y,m+1,0).getDate())/7)*7;
  const end=new Date(start);end.setDate(start.getDate()+days-1);
  const map=eventsBetween(fmt(start),fmt(end));const t=today();
  let cells='';
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const ds=fmt(d);const ev=map[ds]||[];
    const shown=ev.slice(0,3);
    cells+=`<button class="cell${d.getMonth()!==m?' out':''}${ds===t?' is-today':''}${ds===selDay?' sel':''}" data-day="${ds}" aria-label="${ds}，${ev.length} 项">
      <span class="d">${d.getDate()}</span>
      ${shown.map(e=>`<span class="ev${e.done?' done':''}${e.over?' over':''}" style="--c:${TYPES[e.type]?.c||TYPES.oth.c}">${TICON[e.type]||TICON.oth}${calScope==='all'&&pets.length>1?esc(e.pet.name)+' ':''}${esc(e.title)}</span>`).join('')}
      ${ev.length>3?`<span class="more">还有 ${ev.length-3} 项</span>`:''}
      <span class="dots">${ev.slice(0,5).map(e=>`<span class="dot" style="background:${e.over?'var(--danger)':TYPES[e.type]?.c||TYPES.oth.c};${e.done?'opacity:.45':''}"></span>`).join('')}</span></button>`;
  }
  const dayEv=map[selDay]||eventsBetween(selDay,selDay)[selDay]||[];
  const sd=parse(selDay);
  el.innerHTML=`<div class="card-h"><h2><span class="hicon" style="background:var(--accent-soft);color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>日历</h2><div class="calbar">
      <div class="seg"><button data-scope="all" aria-pressed="${calScope==='all'}">全部宠物</button><button data-scope="one" aria-pressed="${calScope==='one'}">只看${esc(cur()?.name||'当前')}</button></div>
      <button class="btn round" id="prev" aria-label="上个月">‹</button><span class="m num">${y} 年 ${m+1} 月</span><button class="btn round" id="next" aria-label="下个月">›</button>
      <button class="btn small ghost" id="tod">回到今天</button></div></div>
    <div class="card-b"><div class="cal">${['一','二','三','四','五','六','日'].map((w,i)=>`<div class="wd${i>4?' we':''}">${w}</div>`).join('')}${cells}</div>
    <div class="legend">${Object.entries(TYPES).map(([k,v])=>`<span>${tic(k)}${v.label}</span>`).join('')}<span><i class="dot" style="background:var(--danger);margin-left:6px"></i>逾期</span></div>
    <div class="daylist"><h3>${sd.getMonth()+1} 月 ${sd.getDate()} 日 周${WD[sd.getDay()]}${selDay===t?' · 今天':''}</h3>
      ${dayEv.length?`<ul>${dayEv.map(e=>`<li>${tic(e.type)}<b style="font-weight:500">${esc(e.pet.name)}</b> ${esc(e.title)} ${e.done?'<span class="pill done">已完成</span>':e.over?'<span class="pill over">逾期</span>':e.type==='bday'?'<span class="pill soon">生日快乐</span>':'<span class="pill later">计划</span>'}
        ${e.plan&&!e.done&&selDay<=t&&e.plan.last!==selDay?`<button class="btn small" data-mark="${e.pet.id}|${e.plan.id}">记为这天完成</button>`:''}</li>`).join('')}</ul>`:'<span class="muted">这天没有安排。</span>'}</div></div>`;
  el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;renderCal()});
  el.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{calScope=b.dataset.scope;renderCal()});
  el.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.mark.split('|');markDone(a,c,selDay)});
  $('#prev').onclick=()=>{calMonth=new Date(y,m-1,1);renderCal()};
  $('#next').onclick=()=>{calMonth=new Date(y,m+1,1);renderCal()};
  $('#tod').onclick=()=>{const d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);selDay=today();renderCal()};
}

  $('#phx').onclick=()=>{d.photo='';$('#phv').hidden=true;$('#phx').hidden=true};
  if(!isNew)$('#del').onclick=e=>{const b=e.currentTarget;if(b.dataset.armed){closeModal();removePet(d.id);toast('已删除');return}
    b.dataset.armed='1';b.textContent='再点一次确认删除（记录一并删除）';b.classList.add('solid')};
  $('#pf').onsubmit=e=>{e.preventDefault();
    const v=id=>$(id).value.trim();
    Object.assign(d,{name:v('#f-name')||'未命名',breed:v('#f-breed'),sex:v('#f-sex'),neutered:v('#f-neu')==='1',birthday:v('#f-bday'),home:v('#f-home'),weight:v('#f-w'),chip:v('#f-chip'),vet:v('#f-vet'),notes:v('#f-notes')});
    if(isNew){d.id=mode==='db'?col.doc().id:uid();d.createdAt=new Date().toISOString();d.plans=defaultPlans(d.species);d.logs=[];d.bond={date:'',n:0,total:0}}
    delete d.example;
    selId=d.id;stageKey='';closeModal();savePet(d);
    toast(isNew?`${d.name} 的档案建好了，去填一下各项计划的上次日期吧`:'已保存');
  };
}
function openPlan(p,pl){
  const isNew=!pl;const x=pl?{...pl}:{id:uid(),type:'in',title:'',every:3,unit:'month',last:'',start:'',note:''};
  openModal(`<form id="plf"><div class="modal-h"><h2>${isNew?'添加计划':'编辑计划'}</h2><button type="button" class="btn ghost small" data-close>关闭</button></div>
  <div class="modal-b"><div class="fields">
    <label class="f">类型<select id="p-type">${Object.entries(TYPES).filter(([k])=>k!=='bday').map(([k,v])=>`<option value="${k}" ${x.type===k?'selected':''}>${v.label}</option>`).join('')}</select></label>
    <label class="f">名称<input id="p-title" required value="${esc(x.title)}" placeholder="例如：大宠爱滴剂"></label>
    <label class="f">每隔<input id="p-every" type="number" min="1" max="99" value="${x.every}"></label>
    <label class="f">单位<select id="p-unit">${Object.entries(UNIT).map(([k,v])=>`<option value="${k}" ${x.unit===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">上次完成<input id="p-last" type="date" value="${esc(x.last)}"></label>
    <label class="f">或：首次计划日<input id="p-start" type="date" value="${esc(x.start)}"></label>
    <label class="f full">备注<input id="p-note" value="${esc(x.note||'')}" placeholder="药名、剂量、医院"></label>
    <p class="muted full" style="margin:0;font-size:12.5px">填了“上次完成”，下次日期会按周期往后推；还没做过就填“首次计划日”。</p>
  </div></div>
  <div class="modal-f">${isNew?'<span></span>':'<button type="button" class="btn danger" id="pdel">删除计划</button>'}<div class="r"><button type="button" class="btn" data-close>取消</button><button class="btn primary">保存</button></div></div></form>`,true);
  const tsel=$('#p-type');tsel.onchange=()=>{if(!$('#p-title').value)$('#p-title').value=TYPES[tsel.value].label};
  if(!isNew)$('#pdel').onclick=e=>{const b=e.currentTarget;if(b.dataset.armed){p.plans=p.plans.filter(y=>y.id!==x.id);closeModal();savePet(p);return}b.dataset.armed='1';b.textContent='确认删除';b.classList.add('solid')};
  $('#plf').onsubmit=e=>{e.preventDefault();
    Object.assign(x,{type:tsel.value,title:$('#p-title').value.trim()||TYPES[tsel.value].label,every:Math.max(1,+$('#p-every').value||1),unit:$('#p-unit').value,last:$('#p-last').value,start:$('#p-start').value,note:$('#p-note').value.trim()});
    p.plans=p.plans||[];const i=p.plans.findIndex(y=>y.id===x.id);if(i<0)p.plans.push(x);else p.plans[i]=x;
    closeModal();savePet(p);toast('计划已保存');
  };
}
function openLog(p){
  openModal(`<form id="lf"><div class="modal-h"><h2>补记一条</h2><button type="button" class="btn ghost small" data-close>关闭</button></div>
  <div class="modal-b"><div class="fields">
    <label class="f">日期<input id="l-date" type="date" required value="${today()}"></label>
    <label class="f">类型<select id="l-type">${Object.entries(TYPES).filter(([k])=>k!=='bday').map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label>
    <label class="f full">内容<input id="l-title" required placeholder="例如：洗澡、看牙、换猫粮"></label>
    <label class="f full">备注<input id="l-note" placeholder="可不填"></label>
    <label class="f full" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="l-upd" style="width:auto" checked>如果有同类型的计划，把它的“上次完成”更新为这天</label>
  </div></div><div class="modal-f"><span></span><div class="r"><button type="button" class="btn" data-close>取消</button><button class="btn primary">记下</button></div></div></form>`,true);
  $('#lf').onsubmit=e=>{e.preventDefault();
    const date=$('#l-date').value,type=$('#l-type').value;
    p.logs=[{id:uid(),date,type,title:$('#l-title').value.trim(),note:$('#l-note').value.trim()},...(p.logs||[])].slice(0,300);
    if($('#l-upd').checked)(p.plans||[]).filter(x=>x.type===type&&(!x.last||x.last<date)).forEach(x=>x.last=date);
    closeModal();savePet(p);toast('已记下');
  };
}
init();
</script>

</body></html>
